<!doctype html>
<html class="h-full bg-gray-800">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    {{ with .Description }}
      <meta name="description" content="{{ . }}" />
    {{ end }}
    <link href="/styles/styles.css" rel="stylesheet" />
    <script src="/js/index.js" defer async></script>
    <link href="/styles/markdown-styles.css" rel="stylesheet" />
  </head>

  <body class="h-full">
    <div class="min-h-full">
      <div class="bg-gray-800 pb-32">
        <nav class="bg-gray-800">
          <div class="mx-auto max-w-7xl sm:px-6 lg:px-8">
            <div class="border-b border-gray-700">
              <div class="flex h-16 items-center justify-between px-4 sm:px-0">
                <div class="flex items-center">
                  <span>Logo</span>
                  <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                      <!-- Current: "bg-gray-900 text-white", Default: "text-gray-300 hover:bg-gray-700 hover:text-white" -->
                      <div id="confirmation"></div>
                      {{ with .Site.Menus.main }}
                        <nav>
                          {{ range . }}
                            <a
                              class="text-gray-200 hover:text-white mx-2"
                              href="{{ .URL | relURL }}"
                              >{{ .Name }}</a
                            >
                          {{ end }}
                        </nav>
                      {{ end }}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </div>
      <main class="-mt-32">
        <div class="mx-auto max-w-7xl px-4 pb-12 sm:px-6 lg:px-8">
          <div
            class="rounded-lg bg-slate-900 px-5 py-6 shadow-sm sm:px-6 text-white"
            id="page"
          >
            {{ block "main" . }}
            {{ end }}
          </div>
        </div>
      </main>
      <footer class="shadow p-4 mt-8">
        <div class="container mx-auto text-center text-gray-300">
          &copy; {{ now.Format "2006" }} {{ .Site.Params.username }}. All rights
          reserved.
        </div>
      </footer>
    </div>
  </body>
</html>
