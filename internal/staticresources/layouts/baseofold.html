<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ .Title }}</title>
    {{ with .Description }}
    <meta name="description" content="{{ . }}" />
    {{ end }}
    <link href="/styles/styles.css" rel="stylesheet" />
  </head>
  <body class="font-sans bg-gray-100 text-gray-900">
    <header class="bg-white shadow p-4">
      <nav class="container mx-auto flex justify-between items-center">
        <a href="/" class="text-2xl font-bold">{{.Site.Title}}</a>
        <div>
          <a href="/" class="text-gray-700 hover:text-gray-900 mx-2">Home</a>
          <a href="/about/" class="text-gray-700 hover:text-gray-900 mx-2"
            >About</a
          >
          <a href="/contact/" class="text-gray-700 hover:text-gray-900 mx-2"
            >Contact</a
          >
        </div>
      </nav>
    </header>

    <main class="container mx-auto p-4">{{ block "main" . }}{{ end }}</main>

    <footer class="bg-white shadow p-4 mt-8">
      <div class="container mx-auto text-center text-gray-600">
        &copy; {{ now.Format "2006" }} {{.Site.Title}}. All rights reserved.
      </div>
    </footer>
  </body>
</html>
