{{ with .Params.breadcrumbs }}
  <nav class="flex gap-2 p-2">
    {{ $total := len .items }}
    {{ range $index, $value := .items }}
      {{ with $.GetPage .url }}
        <a href="{{ .RelPermalink }}" class="bg-purple-500 rounded p-1"
          >{{ .LinkTitle }}</a
        >
        {{ if ne $index (sub $total 1) }}
          >>
        {{ end }}
      {{ end }}
    {{ end }}
  </nav>
{{ end }}
