<details>
  <summary>Debugging info</summary>
  <ul>
    {{ with resources.Get "testing.txt" }}
      <li>{{ . }}</li>
    {{ end }}
  </ul>
  {{ range $k, $v := .Params }}
    <p>Key: {{ $k }} — Value: {{ $v }}</p>
  {{ end }}
  <p>Kind: {{ .Kind }}</p>
  <p>Type: {{ .Type }}</p>
  <p>Resources:</p>
  {{ range .Resources }}
    {{ .Name }}
  {{ end }}
</details>
