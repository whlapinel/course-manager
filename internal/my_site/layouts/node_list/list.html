<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{ .Title }}</title>
</head>

<body>
    <h1>{{ .Title }} for {{ .Params.name }}</h1>
    <ul>
        {{ range .Pages }}
        {{ if .Params.designation }}
        <li><a href="{{ .RelPermalink }}">{{.Params.designation}} : {{ .Title }}</a></li>
        {{ else }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
        {{ end }}
    </ul>

</body>

</html>
