version: "3"

tasks:
  export-secrets:
    desc: Export all secret files in a separate folder for publishing elsewhere
    cmds:
      - go run ./cmd/export_secret

  generate:
    desc: Generate tailwind, typescript, and templ. Run if typescript or templ files have been modified
    cmds:
      - go generate ./...

  sync-site:
    desc: Push generated site code to GitHub to make publicly available
    cmds:
      - cd python && git add .
      - cd python && git commit -m "auto-sync"
      - cd python && git push

  gen-run-dev:
    desc: Generate then run
    deps:
      - generate
    cmds:
      - echo 'Starting Course Manager'
      - go run ./cmd/web_app

  run-dev:
    desc: Build and run without generate (for when we're not changing UI)
    cmds:
      - export ENV=development && go run ./cmd/web_app

  make-build-dirs:
    desc: create the directories for the build
    cmds:
      - mkdir -p build
      - mkdir -p build/cmd
      - mkdir -p build/cmd/web_app
      - mkdir -p build/internal
      - mkdir -p build/internal/data
      - mkdir -p build/internal/data/database
      - mkdir -p build/internal/data/database/migrations

  build:
    desc: Build the go binary and copy into build directory
    deps:
      - make-build-dirs
    cmds:
      - cp -r internal/data/database/migrations ./build/internal/data/database
      - go build -o ./build/cmd/web_app ./cmd/web_app

  copy-data:
    desc: Copy data to build directory, including database and user files
    deps:
      - make-build-dirs
    cmds:
      - cp -r ./internal/data/users ./build/internal/data
      - cp internal/data/database/course_manager.db ./build/internal/data/database/course_manager.db

  tar-data:
    desc: Prepare database and files for sending to remote server
    cmds:
      - mkdir build
      - mkdir build/internal
      - mkdir build/internal/data
      - mkdir build/internal/data/database
      - cp -r ./internal/data/users ./build/internal/data
      - cp internal/data/database/course_manager.db ./build/internal/data/database/course_manager.db
      - tar -czf data.tar.gz -C ./build .

  tar-build:
    desc: Self-explanatory
    deps:
      - build
    cmds:
      - tar -czf web_app.tar.gz -C ./build .

  docker:build:
    desc: Build docker image
    cmds:
      - docker build -t whlapinel/course-manager .

  docker:run:
    desc: Run with .env files as volumes
    cmds:
      - ./scripts/docker_run.sh

  full-monty:
    desc: This regenerates the templates, javascript and stylesheets, builds the binary and copies it to build, and rebuilds the docker image.
    deps:
      - generate
      - build
      - docker:build
