version: "3"

tasks:
  hello:
    cmds:
      - echo 'Hello World from Task!'
    silent: true

  generate:
    desc: Generate stuff and things
    cmds:
      - go generate ./...

  sync-site:
    desc: Push generated site code to GitHub to make publicly available
    cmds:
      - cd python && git add .
      - cd python && git commit -m "auto-sync"
      - cd python && git push
      - cd python && git switch main
      - cd python && git merge dev -m "auto"
      - cd python && git push
      - cd python && git switch dev

  run-fyne-manager:
    desc: Start Fyne course manager app locally
    deps:
      - generate
    cmds:
      - echo 'Starting Course Manager'
      - go run ./cmd/fyne_app

  run-web-manager:
    desc: Start server for course manager web application
    deps:
      - generate
    cmds:
      - echo 'Starting Course Manager'
      - go run ./cmd/web_app
