version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/data/database/terms.sql"
      - "internal/data/database/courses.sql"
      - "internal/data/database/units.sql"
      - "internal/data/database/lessons.sql"
      - "internal/data/database/dates.sql"

    schema: "internal/data/database/migrations/schema"
    gen:
      go:
        package: "database"
        out: "internal/data/database"
